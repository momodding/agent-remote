<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <link rel="stylesheet" href="./xterm.css" />
  <style>html,body,#terminal{height:100%;margin:0;background:#0a0a0a} .xterm{padding:8px;box-sizing:border-box}</style>
</head>
<body>
  <div id="terminal"></div>
  <script src="./xterm.js"></script>
  <script src="./xterm-addon-fit.js"></script>
  <script>
    const terminal = new Terminal({
      cursorBlink: true,
      scrollback: 10000,
      fontFamily: 'monospace',
      fontSize: 14,
      theme: { background: '#0a0a0a', foreground: '#f0f0f0', cursor: '#d19a2c', selectionBackground: '#46b8c466' },
    });
    const fit = new FitAddon.FitAddon();
    terminal.loadAddon(fit);
    terminal.open(document.getElementById('terminal'));
    const resize = () => { fit.fit(); window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'resize', cols: terminal.cols, rows: terminal.rows })); };
    terminal.onData(data => window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'input', data })));
    window.addEventListener('resize', resize);
    setTimeout(resize, 0);
    window.addEventListener('message', event => {
      const message = JSON.parse(event.data);
      if (message.type === 'output') terminal.write(message.data);
      if (message.type === 'clear') terminal.clear();
    });
    document.addEventListener('message', event => window.dispatchEvent(new MessageEvent('message', { data: event.data })));
  </script>
</body>
</html>
