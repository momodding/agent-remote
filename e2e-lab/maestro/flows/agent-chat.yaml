appId: com.paperplain.agenticremote
---
- launchApp

- wait:
    duration: 1000

- tapOn:
    text: Agent

- wait:
    duration: 500

- tapOn:
    id: chat_input

- inputText: What is the current directory?

- tapOn:
    text: Send

- wait:
    duration: 2000

- assertVisible:
    text: response

- screenshot

- tapOn:
    id: chat_input

- inputText: List files here

- tapOn:
    text: Send

- wait:
    duration: 2000

- screenshot
