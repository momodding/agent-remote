appId: com.paperplain.agenticremote
---
- launchApp

- tapOn:
    text: Terminal

- wait:
    duration: 1000

- tapOn:
    id: terminal_input

- inputText: ls -la

- keyPress: return

- wait:
    duration: 1000

- tapOn:
    text: New Tab

- wait:
    duration: 500

- screenshot

- tapOn:
    text: Terminal
    index: 0

- wait:
    duration: 500

- screenshot
