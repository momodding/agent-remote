# Supply a fresh v2 payload in safe transport-sized chunks (170 chars maximum).
# The caller must enable “Skip fingerprint verification” in the visible switch
# before running this flow; it is required for the emulator's self-signed daemon.
appId: com.paperplain.agenticremote
---
- launchApp

- tapOn:
    text: Connect daemon

- assertVisible:
    text: Connect a daemon

- tapOn:
    text: Paste pairing JSON

- inputText: ${PAIRING_PAYLOAD_CHUNK_1}
- inputText: ${PAIRING_PAYLOAD_CHUNK_2}

- assertVisible:
    text: Skip fingerprint verification

- tapOn:
    text: Connect

# Successful pairing dismisses the sheet and renders the daemon deck.
- assertNotVisible:
    text: Connect a daemon
