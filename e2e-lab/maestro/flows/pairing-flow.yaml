appId: com.paperplain.agenticremote
---
- launchApp

- tapOn:
    text: Pair

- tapOn:
    text: Manual Input

# Android emulator accesses host loopback via 10.0.2.2 over HTTPS
- inputText: https://10.0.2.2:18765

- tapOn:
    text: Connect

- wait:
    duration: 2000

- assertVisible:
    text: Paired

- screenshot
