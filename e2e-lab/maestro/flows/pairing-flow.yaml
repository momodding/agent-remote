appId: com.agentic_remote.client
---
- launchApp

- tapOn:
    text: Pair
    optional: true

- tapOn:
    text: Manual Input
    optional: true

# Android emulator accesses host loopback via 10.0.2.2 over HTTPS
- inputText: https://10.0.2.2:18765
  optional: true

- tapOn:
    text: Connect
    optional: true

- wait:
    duration: 2000

- assertVisible:
    text: Paired
    optional: true

- screenshot
